[package]
name = "dungeon-crawler"
version = "0.1.0"
edition = "2021"
include = ["/assets, README.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.17"
serde = "1.0"
serde_json = "1.0"
rand = "0.9"
itertools = "0.14"
priority-queue = "1.2"
positioning = { path = "positioning", features = ["bevy", "serde"] }
bevy_egui = "0.38"

# Web build: getrandom 0.3 (pulled in by rand 0.9) needs the wasm_js backend
# to compile for wasm32-unknown-unknown. See .cargo/config.toml for the
# companion rustflag (both are required).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
