# getrandom 0.3 (via rand 0.9) requires this backend cfg to build for the web.
# The `wasm_js` feature on the getrandom dependency is necessary but not
# sufficient on its own — this rustflag is also required.
# https://docs.rs/getrandom/0.3/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
